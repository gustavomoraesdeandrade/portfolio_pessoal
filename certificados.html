    <h1>Certificados:</h1>

    <div class="certificados">

        <button class="seta" onclick="anterior()">←</button>

        <img id="certificado" src="" alt="Certificado">

        <button class="seta" onclick="proximo()">→</button>

    </div>

    <script>

        const certificados = [
            "Captura de tela 2026-09-30 081903.png",
            "Captura de tela 2026-09-30 082120.png"
        ];

        let atual = 0;

        function proximo() {
            atual++;

            if (atual >= certificados.length) {
                atual = 0;
            }

            document.getElementById("certificado").src = certificados[atual];
        }

        function anterior() {
            atual--;

            if (atual < 0) {
                atual = certificados.length - 1;
            }

            document.getElementById("certificado").src = certificados[atual];
        }

    </script>

</body>
